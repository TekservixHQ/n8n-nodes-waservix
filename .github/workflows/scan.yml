# Runs n8n's official community package scanner against the published package.
name: n8n scan
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -o pipefail
          npx -y @n8n/scan-community-package@latest n8n-nodes-waservix 2>&1 | cat
